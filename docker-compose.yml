services:
  web:
    build: .
    container_name: eden_dossier_web
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: eden_dossier_db
    restart: always
    environment:
      POSTGRES_DB: eden_dossier
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    volumes:
      - eden_dossier_data:/var/lib/postgresql/data

volumes:
  eden_dossier_data: